<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22272e"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#373e47" stroke-width="2"/>

  <!-- Ícone do Acervo / Livro de Provas -->
  <g transform="translate(10, 10)" filter="url(#shadow)">
    <!-- Páginas do livro aberto -->
    <path d="M6 35V11a3 3 0 0 1 3-3h26v27H9.5A3.5 3.5 0 0 0 6 38.5z"
          fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M35 35v5H9.5"
          fill="none" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Linhas de texto simulando exame / prova -->
    <line x1="14" y1="16" x2="27" y2="16" stroke="#79c0ff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="22" x2="23" y2="22" stroke="#8fb3a6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="28" x2="20" y2="28" stroke="#adbac7" stroke-width="2" stroke-linecap="round"/>

    <!-- Ponto de destaque (aprovação / gabarito) -->
    <circle cx="28" cy="25" r="2.5" fill="#56d364"/>
  </g>
</svg>

